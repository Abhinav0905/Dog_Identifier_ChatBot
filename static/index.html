<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Dorjee</title>
    <link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body>
    <div class="header">
        <div class="header-brand">
            <h1>Ask Dorjee</h1>
            <div class="subtitle">Your trusted guide to India's street dogs.</div>
        </div>
        <a class="header-home-link" href="https://dharamsalaanimalrescue.org/" target="_blank" rel="noopener">
            <span>Back to</span>
            <img src="/static/assets/dar-logo.png" alt="Dharamsala Animal Rescue">
        </a>
    </div>

    <div class="landing">
        <div class="dorjee-intro">
            <img
                class="dorjee-portrait"
                src="/static/assets/ask-dorjee.png"
                alt="Dorjee saying, Hi! I'm Dorjee."
            >
            <button class="open-chat-btn" id="openChatBtn">Start Chat</button>
        </div>
    </div>

    <div class="chat-container hidden">
        <div class="chat-toolbar">
            <div class="conversation-tools">
                <span class="conversation-status" id="conversationStatus" role="status" aria-live="polite">
                    Starting conversation&hellip;
                </span>
                <button class="new-chat-btn" id="newChatBtn" type="button" disabled>New chat</button>
            </div>
            <button class="minimize-btn" id="minimizeBtn" title="Minimize chat">&#8722;</button>
        </div>
        <div class="chat-messages" id="chatMessages">
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <div class="input-area">
            <div class="upload-preview" id="uploadPreview">
                <img id="previewImg" src="" alt="Preview">
                <span id="fileName"></span>
                <button class="remove-btn" id="removeBtn" title="Remove image">&#10005;</button>
            </div>
            <div class="location-bar" id="locationBar">
                &#128205; Location: <span id="locationText">Not shared</span>
            </div>
            <div class="map-actions" id="mapActions">
                <button class="map-action-btn" id="vetMapBtn">Rescue nearby</button>
                <button class="map-action-btn" id="rescueMapBtn">Animal help nearby</button>
            </div>
            <div class="input-row">
                <button class="btn-icon" id="locationBtn" title="Share location">
                    &#128205;
                </button>
                <button class="btn-icon" id="cameraBtn" title="Upload image">
                    &#128247;
                </button>

                <input type="file" id="fileInput" class="file-input" accept="image/*,.heic,.heif">
                <textarea id="messageInput" placeholder="Describe the situation or ask about community dogs..." rows="1" disabled></textarea>
                <button class="btn btn-primary" id="sendBtn" disabled>Send</button>
            </div>
        </div>

        <div class="status-bar" role="note">
            Ask Dorjee is powered by AI and may make mistakes. Please verify important information.
        </div>

    </div>

    <footer class="site-footer">
        <span>[Powered by <a href="https://gaia-ai.org/" target="_blank" rel="noopener">Gaia-ai.org</a> | In memory of Kimberly Iyer]</span>
    </footer>

    <script src="/static/app.js?v=25"></script>
</body>
</html>
